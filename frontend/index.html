<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F1F1EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Science Extract</title>
    <script>
      // Тема до первой отрисовки, чтобы не мигал светлый фон в тёмной теме.
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('se-theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body class="ui"><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
