# Назначение файла: ingress request IDs, byte limit, allowlisted headers и private health/metrics.
events { worker_connections 1024; }
http {
  log_format safe escape=json '{"request_id":"$request_id","status":$status,"elapsed":$request_time}';
  access_log /var/log/nginx/access.log safe;
  server_tokens off;
  client_max_body_size 101m;
  upstream gateway { server krakend:8080; }
  upstream backend { server backend:8000; }
  upstream auth { server auth:8000; }
  server {
    listen 80;
    # TLS_PRODUCTION
    add_header X-Request-ID $request_id always;
    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ingress_live"}'; }
    # Disable inherited request headers, then pass only known non-identity fields.
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header Accept $http_accept;
    proxy_set_header If-Match $http_if_match;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header Origin $http_origin;
    proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
    proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    proxy_read_timeout 180s;
    proxy_request_buffering on;
    location /api/v1/ { proxy_pass http://gateway; }
    location = /docs { proxy_pass http://backend/docs; }
    location = /openapi.json { proxy_pass http://backend/openapi.json; }
    location = /auth-openapi.json { proxy_pass http://auth/openapi.json; }
    location = /.well-known/jwks.json { proxy_pass http://auth/.well-known/jwks.json; }
    location / { return 404; }
  }
}
